[project]
name = "grow-guide-qa"
version = "0.1.0"
description = "Question answering over freely licensed microgreens and indoor-farming guides, with a retrieval and answer-quality evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aidan McKittrick" }]
# Runtime dependencies are added in the step that first needs them, so each
# pull request shows exactly why a library was introduced.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grow_guide_qa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear (likely bugs),
# UP: modern syntax for the target Python, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
